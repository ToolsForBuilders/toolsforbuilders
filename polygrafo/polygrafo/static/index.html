<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polígrafo pessoal</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#5b6470; --line:#e2e5ea;
          --ok:#1a7f37; --warn:#b26b00; --bad:#c62828; --na:#6b7280; --accent:#2f5bd3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1a1e24; --fg:#e7eaee; --muted:#9aa4b1;
          --line:#2b313a; --ok:#4cc26a; --warn:#e3a33b; --bad:#ef6461; --na:#9aa4b1; --accent:#7aa2ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width:860px; margin:0 auto; padding:24px 16px 64px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  input[type=url], textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  button { margin-top:14px; padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; font:inherit; }
  button:disabled { opacity:.6; cursor:wait; }
  .hint { color:var(--muted); font-size:.9rem; }
  .score { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .gauge { width:96px; height:96px; border-radius:50%; display:grid; place-items:center; font-size:1.6rem; font-weight:700; flex:none; }
  .gauge span { background:var(--card); width:76px; height:76px; border-radius:50%; display:grid; place-items:center; }
  .label { font-size:1.2rem; font-weight:700; }
  .claim { border-top:1px solid var(--line); padding-top:12px; margin-top:12px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.85rem; font-weight:600; color:#fff; }
  .meter { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0; }
  .meter i { display:block; height:100%; }
  details { margin-top:8px; }
  .ev { padding:8px 0; border-bottom:1px dashed var(--line); font-size:.93rem; }
  .ev a { color:var(--accent); word-break:break-all; }
  .stance { font-weight:700; }
  .apoia { color:var(--ok); } .refuta { color:var(--bad); } .neutro { color:var(--na); }
  .note { color:var(--warn); font-size:.9rem; }
  blockquote { margin:4px 0 0; padding-left:10px; border-left:3px solid var(--line); color:var(--muted); }
  .err { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Polígrafo pessoal</h1>
  <p class="sub">Verifica afirmações publicadas no Facebook, Instagram, TikTok, X, YouTube e outras redes, com fontes e score.</p>

  <form id="f" class="card">
    <label for="url">Link da publicação</label>
    <input id="url" name="url" type="url" placeholder="https://www.tiktok.com/@conta/video/…">
    <label for="text">Ou cole o texto da publicação</label>
    <textarea id="text" name="text" placeholder="Útil quando a rede social exige sessão iniciada e o link não pode ser lido."></textarea>
    <label for="image">Ou envie uma captura de ecrã</label>
    <input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
    <p class="hint">A análise pesquisa várias fontes e pode demorar 1–3 minutos por afirmação.</p>
    <button id="go" type="submit">Verificar</button>
  </form>

  <div id="out"></div>
</main>
<script>
const color = s => s == null ? 'var(--na)' : s >= 60 ? 'var(--ok)' : s > 40 ? 'var(--warn)' : 'var(--bad)';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? esc(u) : '#';
const pct = x => Math.round((x || 0) * 100) + '%';

function render(r) {
  const s = r.overall_score;
  let h = `<div class="card"><div class="score">
    <div class="gauge" style="background:conic-gradient(${color(s)} ${s ?? 0}%, var(--line) 0)"><span>${s == null ? '?' : Math.round(s)}</span></div>
    <div><div class="label" style="color:${color(s)}">${esc(r.overall_label)}</div>
    <div class="hint">Confiança ${pct(r.overall_confidence)} · ${esc(r.post.platform)}${r.post.author ? ' · ' + esc(r.post.author) : ''}${r.post.published_at ? ' · ' + esc(r.post.published_at) : ''}</div>
    <div>${esc(r.summary)}</div></div></div>
    ${r.post.extraction_notes.map(n => `<div class="note">⚠ ${esc(n)}</div>`).join('')}
    <details><summary>Texto analisado</summary><blockquote>${esc(r.post.text || r.post.transcript || '—')}</blockquote></details>`;

  for (const c of r.claims) {
    h += `<div class="claim"><div><span class="pill" style="background:${color(c.score)}">${c.score == null ? '—' : Math.round(c.score) + '/100'}</span>
      <strong> ${esc(c.label)}</strong> <span class="hint">· confiança ${pct(c.confidence)}</span></div>
      <p><strong>#${c.claim.id}</strong> “${esc(c.claim.text)}”</p>
      ${c.score != null ? `<div class="meter"><i style="width:${c.score}%;background:${color(c.score)}"></i></div>` : ''}
      ${c.reasoning ? `<p>${esc(c.reasoning)}</p>` : ''}
      ${c.missing_context ? `<p class="note"><strong>Contexto em falta:</strong> ${esc(c.missing_context)}</p>` : ''}
      <details ${c.evidence.length ? 'open' : ''}><summary>Provas e fontes (${c.evidence.length})</summary>
      ${c.evidence.map(e => `<div class="ev"><span class="stance ${e.stance}">${{apoia:'✔ Apoia',refuta:'✘ Refuta',neutro:'• Neutro'}[e.stance]}</span>
        — <strong>${esc(e.domain)}</strong> <span class="hint">(${esc(e.source_tier)}, fiabilidade ${e.reliability.toFixed(2)}, relevância ${e.relevance.toFixed(2)})</span>
        ${e.is_professional_factcheck ? `<span class="pill" style="background:var(--accent)">Fact-check: ${esc(e.factcheck_rating)}</span>` : ''}
        <div><a href="${safeUrl(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title || e.url)}</a></div>
        ${e.excerpt ? `<blockquote>${esc(e.excerpt)}</blockquote>` : ''}
        ${e.note ? `<div class="hint">${esc(e.note)}</div>` : ''}</div>`).join('') || '<p class="hint">Sem evidências.</p>'}
      </details></div>`;
  }
  h += `<details><summary>Como é calculado o score</summary><ul>${r.method_notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></details></div>`;
  return h;
}

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  if (!fd.get('url') && !fd.get('text') && !(fd.get('image') && fd.get('image').size)) {
    document.getElementById('out').innerHTML = '<p class="err">Indique um link, texto ou imagem.</p>'; return;
  }
  if (!(fd.get('image') && fd.get('image').size)) fd.delete('image');
  const btn = document.getElementById('go'), out = document.getElementById('out');
  btn.disabled = true; btn.textContent = 'A verificar…';
  out.innerHTML = '<div class="card hint">A extrair afirmações, pesquisar fontes e cruzar informação…</div>';
  try {
    const res = await fetch('/api/check', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    out.innerHTML = render(data);
  } catch (e) {
    out.innerHTML = `<div class="card err">Erro: ${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Verificar'; }
});
</script>
</body>
</html>
